# Netlify config for the FRSMS frontend.
#
# The Express backend is NOT deployed by this file -- Netlify doesn't run
# persistent Node servers. Host `backend/` separately (Render, Railway,
# Fly.io, or Vercel) and point VITE_API_URL below at it. See README.md.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "20"

# Client-side routing (React Router) -- send every unknown path to
# index.html so routes like /incidents or /gps-tracker work on refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Reminder: set these in Netlify's Site settings -> Environment variables
# (they can't live in this file since they include secrets/URLs specific
# to your Supabase project and backend deployment):
#   VITE_SUPABASE_URL
#   VITE_SUPABASE_ANON_KEY
#   VITE_API_URL
